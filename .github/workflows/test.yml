name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and test tools
        run: pip install ".[dev]"
      - name: Confirm pytest will import the installed copy
        run: |
          python -c "import eegmath, importlib.metadata, pathlib; p = pathlib.Path(eegmath.__file__); assert 'site-packages' in p.parts, p; assert importlib.metadata.version('eegmath') == eegmath.__version__"
      - name: Run the suite
        run: pytest
