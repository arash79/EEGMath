[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eegmath"
version = "1.0.0"
description = "Mathematical and statistical toolkit for EEG analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "Arash Zarrin Nia"},
  {name = "Annalotta Scheinin"},
  {name = "Jaakko Långsjö"},
  {name = "Katja Valli"},
  {name = "Oskari Kantonen"},
  {name = "Roosa E. Kallionpää"},
  {name = "Harry Scheinin"},
  {name = "Sampsa Pursiainen"},
]
keywords = ["eeg", "signal-processing", "statistics", "neuroscience"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "mne>=1.6",
  "pymatreader>=0.0.32",
  "h5py>=3.8",
  "statsmodels>=0.14",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
parallel = ["joblib>=1.3"]
dev = ["pytest>=8", "build", "hatchling"]
notebooks = ["jupyter", "nbclient", "nbformat", "ipykernel"]

[tool.hatch.build.targets.wheel]
packages = ["src/eegmath"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
exclude = [
  "/external_data",
  "/data",
  "/results",
  "/docs/validation/executed",
  "/manuscript",
  "/private",
  "/validation_output",
  "/docs/review",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Tests import the installed package. `tests` stays on the path for the
# synthetic helpers. Install with `pip install -e ".[dev]"` before pytest.
pythonpath = ["tests", "examples"]
